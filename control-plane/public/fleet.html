<!doctype html>
<!-- control-plane/public/fleet.html
     Fleet Console GEOGRAPHIC MAP view (TOPOLOGY_..._MEMORY.md §1). One pin per
     monitored site, colored by overall site status (worst of critical services).
     RBAC: ops-manager/support-technician see all pins; customer-it-admin sees
     only their own site. No AI, no generative overlays — just status facts. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Beacon Relay — Fleet Map</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 1.5rem; color: #17202a; background:#f7f9fa; }
  h1 { border-bottom: 2px solid #1a5276; padding-bottom: .3rem; }
  #controls { margin: 1rem 0; }
  #controls label { margin-right: .5rem; }
  #controls select { margin-right: 1rem; }
  #map { background: #fff; border: 1px solid #ccd; border-radius: 8px; width: 960px; height: 540px; }
  .legend span { margin-right: .8rem; font-size: 13px; }
  .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
  .pin { cursor: pointer; }
  .pin circle { stroke: #fff; stroke-width: 2; }
  .pin text { font-size: 11px; text-anchor: middle; fill: #17202a; pointer-events: none; }
  .st-reachable { fill: #3498db; } .st-verified_ready { fill: #1e8449; } .st-active { fill: #1e8449; }
  .st-degraded { fill: #b26a00; } .st-down { fill: #b03a2e; } .st-unknown { fill: #95a5a6; }
  #panel { margin-top: 1rem; padding: 1rem; background: #fff; border: 1px solid #ccd; border-radius: 8px; max-width: 960px; }
  #demo-banner { display: none; background: #b26a00; color: #fff; text-align: center; padding: 8px; font-weight: 600; margin-bottom: 1rem; }
  #demo-banner.visible { display: block; }
</style>
</head>
<body>
  <div id="demo-banner">DEMO MODE — Synthetic data only. No real hospitals, patients, or PHI.</div>
  <h1>Beacon Relay — Fleet Map</h1>
  <div class="legend">
    <span><span class="dot" style="background:#1e8449"></span>active / verified_ready</span>
    <span><span class="dot" style="background:#3498db"></span>reachable</span>
    <span><span class="dot" style="background:#b26a00"></span>degraded</span>
    <span><span class="dot" style="background:#b03a2e"></span>down</span>
    <span><span class="dot" style="background:#95a5a6"></span>unknown</span>
  </div>
  <div id="controls">
    <label>Role:
      <select id="role">
        <option value="operations-manager">operations-manager</option>
        <option value="support-technician">support-technician</option>
        <option value="customer-it-admin">customer-it-admin</option>
      </select>
    </label>
    <label>Site (customer-it-admin only):
      <input id="siteId" type="text" placeholder="site-uuid" size="36">
    </label>
    <button onclick="loadMap()">Load map</button>
  </div>
  <svg id="map"></svg>
  <div id="panel"><em>Click a pin for site details.</em></div>

<script>
(async () => {
  const params = new URLSearchParams(location.search);
  if (params.has('demo')) {
    document.getElementById('demo-banner').classList.add('visible');
  } else {
    try {
      const r = await fetch('/api/demo');
      if ((await r.json()).demo) document.getElementById('demo-banner').classList.add('visible');
    } catch { /* ignore */ }
  }
})();
const $ = s => document.querySelector(s);
const W = 960, H = 540;
const mapSvg = $('#map');
mapSvg.setAttribute('viewBox', `0 0 ${W} ${H}`);

function statusClass(s) { return 'st-' + (s || 'unknown'); }

function project(lat, lng) {
  // Simple equirectangular projection for demo purposes.
  // Normalize lat [-90,90] -> y [H,0] and lng [-180,180] -> x [0,W].
  const x = ((lng + 180) / 360) * W;
  const y = H - ((lat + 90) / 180) * H;
  return { x, y };
}

async function loadMap() {
  const role = $('#role').value;
  const siteId = $('#siteId').value.trim();
  let url = `/api/fleet/map?role=${encodeURIComponent(role)}`;
  if (role === 'customer-it-admin' && siteId) url += `&site_id=${encodeURIComponent(siteId)}`;
  const res = await fetch(url);
  const data = await res.json();
  if (!res.ok) {
    mapSvg.innerHTML = '';
    $('#panel').innerHTML = `<b>Error:</b> ${escapeHtml(data.error ?? res.status)}`;
    return;
  }
  renderMap(data.sites ?? []);
}

function renderMap(sites) {
  mapSvg.innerHTML = '';
  // Draw a subtle grid so the projection is visible even with no basemap.
  for (let i = 0; i <= 6; i++) {
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', 0); line.setAttribute('y1', i * H / 6);
    line.setAttribute('x2', W); line.setAttribute('y2', i * H / 6);
    line.setAttribute('stroke', '#eef1f2'); line.setAttribute('stroke-width', 1);
    mapSvg.appendChild(line);
  }
  for (let i = 0; i <= 12; i++) {
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', i * W / 12); line.setAttribute('y1', 0);
    line.setAttribute('x2', i * W / 12); line.setAttribute('y2', H);
    line.setAttribute('stroke', '#eef1f2'); line.setAttribute('stroke-width', 1);
    mapSvg.appendChild(line);
  }

  for (const site of sites) {
    if (site.lat == null || site.lng == null) continue;
    const pos = project(site.lat, site.lng);
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('class', 'pin');
    g.setAttribute('transform', `translate(${pos.x}, ${pos.y})`);
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('r', 10);
    c.setAttribute('class', statusClass(site.status));
    g.appendChild(c);
    const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    t.setAttribute('y', 22);
    t.textContent = site.name;
    g.appendChild(t);
    g.onclick = () => showSite(site);
    mapSvg.appendChild(g);
  }
  $('#panel').innerHTML = `<em>${sites.length} site pin(s) loaded. Click a pin for details.</em>`;
}

function showSite(site) {
  $('#panel').innerHTML = `
    <b>${escapeHtml(site.name)}</b><br>
    Site ID: <code>${escapeHtml(site.site_id)}</code><br>
    Status: <b>${escapeHtml(site.status)}</b><br>
    Lat/Lng: ${site.lat != null ? site.lat.toFixed(4) : 'n/a'}, ${site.lng != null ? site.lng.toFixed(4) : 'n/a'}
  `;
}

function escapeHtml(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

loadMap();
</script>
</body>
</html>
