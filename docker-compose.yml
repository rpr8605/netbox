# docker-compose.yml — Phase 1 local stack
# step-ca (private CA) + PostgreSQL + control-plane (Fastify API + console) + device simulator.
# All services are local-only; no real hospital data, no real HL7 feed.
#
# Copy .env.example to .env and fill in values before running `docker compose up`.
# .env is gitignored and must never be committed.
services:
  step-ca:
    image: smallstep/step-ca:latest
    container_name: beacon-relay-step-ca
    user: root
    entrypoint: ["sh", "/home/step/entrypoint.sh"]
    environment:
      CA_PASSWORD: ${CA_PASSWORD}
      STEPPATH: /home/step
    volumes:
      - ./pki-config/entrypoint.sh:/home/step/entrypoint.sh:ro
      - ./pki-config/config.render:/home/step/config
      - pki-certs:/home/step/certs
      - pki-secrets:/home/step/secrets
      - pki-db:/home/step/db
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-qO-", "https://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    image: postgres:15-alpine
    container_name: beacon-relay-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  control-plane:
    build:
      context: .
      dockerfile: control-plane/Dockerfile
    container_name: beacon-relay-control-plane
    environment:
      NODE_ENV: development
      PORT: 9100
      # BIND_HOST: safe default in the image is 127.0.0.1 (localhost-only). In the
      # compose network we bind 0.0.0.0 so device-sim and the vm-harness can reach
      # the control plane; the host port is still gated by the publish line below.
      BIND_HOST: ${BIND_HOST}
      CA_URL: https://step-ca:9000
      CA_FINGERPRINT: ${CA_FINGERPRINT}
      PROVISIONER_NAME: ${PROVISIONER_NAME}
      PROVISIONER_PRIVATE_JWK_PATH: /run/secrets/provisioner_private_jwk
      # Production storage is PostgreSQL. The legacy DB_PATH is kept only for
      # the one-time migration script; new installs write straight to Postgres.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DB_PATH: /data/beacon-relay.db
      # The OTA release surface (routes/releases.js) reads the build's out/
      # tree for the latest-version pointer and the signed bundle bytes.
      RELEASES_DIR: /out
      # DEMO_MODE=1 puts a banner on every console page and seeds synthetic data.
      DEMO_MODE: ${DEMO_MODE}
    volumes:
      - ./pki-config/provisioner/private_jwk.json:/run/secrets/provisioner_private_jwk:ro
      - ./out:/out:ro
      - cp-data:/data
    ports:
      # Host-side port is configurable. Default is 10443 because Windows/Hyper-V
      # reserves 9100 in excluded range 9035-9134 on the build machine. To disable
      # host publish entirely, override this to an empty list in a compose override
      # file or unset the line (the container port remains 9100 for compose-internal
      # services like device-sim and the vm-harness).
      - "${CONTROL_PLANE_HOST_PORT}:9100"
    depends_on:
      step-ca:
        condition: service_healthy
      postgres:
        condition: service_healthy

  device-sim:
    build:
      context: .
      dockerfile: device-sim/Dockerfile
    container_name: beacon-relay-device-sim
    environment:
      CONTROL_PLANE_URL: https://control-plane:9100
      CA_URL: https://step-ca:9000
      # DEMO_MODE=1 keeps the simulator alive, posting periodic heartbeats and
      # events for the duration of a demo session instead of exiting after tests.
      DEMO_MODE: ${DEMO_MODE}
    depends_on:
      control-plane:
        condition: service_started

volumes:
  pki-db:
  pki-certs:
  pki-secrets:
  cp-data:
  pg-data:
