# vm-harness/compose.yml — run the QEMU harness against a built disk image.
services:
  vm-harness:
    build:
      context: ..
      dockerfile: vm-harness/Dockerfile
    privileged: true
    volumes:
      - ../out:/out
      - vm-serial:/tmp
    networks:
      - default
      - netbox_default   # the real control-plane's compose network (project name
                         # is the directory name `netbox`, not the brand). Reach it
                         # for enrollment; do not rename this to the brand — the
                         # network name is derived from the directory, not the product.
    command: ["bash", "/work/vm-harness/run_qemu.sh", "${RELEASE_VERSION:-0.1.0}"]
networks:
  netbox_default:
    external: true
volumes:
  vm-serial:
